<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Three-wire 3.3 volt Hall-throttle interface</title>
  <desc id="description">The PCB generates a protected 3.3 volt throttle supply and sends it through Molex F2, receives the Hall signal through Molex F3, and provides a quiet return through Molex F4. The external Hall-throttle output ranges from 0.82 to 2.0 volts. Connector transient suppression is allocated to a protection return before a measured 0.982 kiloohm series resistor. At the ADC2 input on SoM pad 91, a 47 kiloohm resistor biases upstream opens low, a 100 nanofarad capacitor filters the signal, and a low-leakage high-low clamp is allocated to qualified current sinks. Measured 1.995 kiloohm and 1.981 kiloohm resistors with a 1 microfarad capacitor monitor the protected sensor supply on ADC2 input 3 at SoM pad 92. Initial static readings are 3.3527 volts at Molex F2, 1.680 volts at pad 92, and 0.8244 volts at pad 91.</desc>

  <defs>
    <style>
      .background { fill: #ffffff; }
      .pcb-zone { fill: #eef6ff; stroke: #3876a8; stroke-width: 2; }
      .external-zone { fill: #fff7e7; stroke: #a96b16; stroke-width: 2; }
      .adc-zone { fill: #effaf1; stroke: #3f7f4d; stroke-width: 2; }
      .protection-zone { fill: #fafafa; stroke: #687078; stroke-width: 2; stroke-dasharray: 8 6; }
      .sensor { fill: #fffdf6; stroke: #a96b16; stroke-width: 3; }
      .wire { fill: none; stroke: #1f2933; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .component { fill: none; stroke: #1f2933; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .junction { fill: #1f2933; }
      .terminal { fill: #ffffff; stroke: #1f2933; stroke-width: 3; }
      .connector { fill: #ffffff; stroke: #a96b16; stroke-width: 3; }
      .title { font: 700 32px "Segoe UI", Arial, sans-serif; fill: #17202a; }
      .section { font: 700 22px "Segoe UI", Arial, sans-serif; fill: #17202a; }
      .label { font: 600 19px "Segoe UI", Arial, sans-serif; fill: #17202a; }
      .small { font: 17px "Segoe UI", Arial, sans-serif; fill: #303942; }
      .tiny { font: 15px "Segoe UI", Arial, sans-serif; fill: #47515a; }
      .net-label { font: 700 18px Consolas, "Courier New", monospace; fill: #155b87; }
      .supply-label { font: 700 18px Consolas, "Courier New", monospace; fill: #9b3a20; }
      .ground-label { font: 700 18px Consolas, "Courier New", monospace; fill: #39434d; }
      .note { font: italic 16px "Segoe UI", Arial, sans-serif; fill: #4c5660; }
    </style>
  </defs>

  <rect class="background" x="0" y="0" width="1600" height="1000"/>
  <text class="title" x="50" y="52">3.3 V Hall-throttle interface</text>
  <text class="small" x="50" y="82">Populated development signal/divider path; protection allocations remain open</text>

  <rect class="pcb-zone" x="35" y="110" width="1020" height="760" rx="16"/>
  <text class="section" x="58" y="143">PCB</text>

  <rect class="external-zone" x="1055" y="110" width="510" height="760" rx="16"/>
  <text class="section" x="1080" y="143">Outside PCB · cable and Hall throttle</text>

  <!-- Protected carrier supply -->
  <text class="supply-label" x="62" y="218">CARRIER_3V3</text>
  <path class="wire" d="M65 230 H190"/>
  <rect class="protection-zone" x="190" y="170" width="250" height="120" rx="12"/>
  <path class="wire" d="M190 230 H440"/>
  <text class="label" x="221" y="205">Protected 3.3 V branch</text>
  <text class="small" x="214" y="249">current limit · reverse blocking</text>
  <text class="tiny" x="222" y="273">F_PWR / load switch / TVS: TBD</text>

  <path class="wire" d="M440 230 H1025"/>
  <circle class="junction" cx="535" cy="230" r="7"/>
  <circle class="junction" cx="700" cy="230" r="7"/>
  <text class="supply-label" x="470" y="208">3V3_THROTTLE</text>

  <!-- PCB supply bypass -->
  <path class="wire" d="M535 230 V320"/>
  <path class="component" d="M502 320 H568 M502 340 H568"/>
  <path class="wire" d="M535 340 V365"/>
  <path class="component" d="M503 365 H567 M513 377 H557 M523 389 H547"/>
  <text class="label" x="455" y="307">C_PWR</text>
  <text class="tiny" x="565" y="367">100 nF + 1.0 µF</text>
  <text class="tiny" x="565" y="387">provisional, X7R</text>

  <!-- Supply-sense divider -->
  <path class="wire" d="M700 230 V305"/>
  <path class="component" d="M700 305 l-13 12 l26 17 l-26 17 l26 17 l-26 17 l13 12"/>
  <path class="wire" d="M700 397 V430"/>
  <circle class="junction" cx="700" cy="430" r="7"/>
  <path class="component" d="M700 450 l-13 12 l26 17 l-26 17 l26 17 l-26 17 l13 12"/>
  <path class="wire" d="M700 430 V450 M700 542 V567"/>
  <path class="component" d="M668 567 H732 M678 579 H722 M688 591 H712"/>
  <text class="label" x="718" y="340">R_VSUP_H</text>
  <text class="small" x="728" y="364">1.995 kΩ</text>
  <text class="tiny" x="728" y="385">measured</text>
  <text class="label" x="718" y="485">R_VSUP_L</text>
  <text class="small" x="728" y="509">1.981 kΩ</text>
  <text class="tiny" x="728" y="532">measured</text>

  <path class="wire" d="M700 430 H815 V500"/>
  <path class="component" d="M783 500 H847 M783 520 H847"/>
  <path class="wire" d="M815 520 V545"/>
  <path class="component" d="M783 545 H847 M793 557 H837 M803 569 H827"/>
  <text class="label" x="835" y="465">C_VSUP</text>
  <text class="small" x="850" y="489">1.0 µF</text>

  <path class="wire" d="M700 430 H315"/>
  <rect class="adc-zone" x="70" y="394" width="245" height="72" rx="10"/>
  <text class="label" x="96" y="421">ADC_VSUP · ADC2_IN3</text>
  <text class="tiny" x="139" y="447">Pad 92 · 1.680 V measured</text>
  <text class="net-label" x="360" y="418">ADC_VSUP</text>

  <!-- Connector power contact and external VCC -->
  <rect class="connector" x="1025" y="210" width="30" height="40" rx="4"/>
  <path class="wire" d="M1055 230 H1220"/>
  <text class="small" x="930" y="180">Molex F2</text>
  <text class="tiny" x="921" y="201">AcHdl 3V3</text>
  <text class="supply-label" x="1080" y="212">THROTTLE_3V3</text>
  <text class="tiny" x="1080" y="258">3.3527 V measured</text>

  <!-- External Hall sensor -->
  <rect class="sensor" x="1220" y="170" width="300" height="650" rx="18"/>
  <text class="section" x="1275" y="213">Hall throttle</text>
  <text class="label" x="1300" y="275">3-wire sensor</text>
  <text class="small" x="1270" y="310">Supply: nominal 3.3 V</text>
  <text class="small" x="1270" y="340">Output: 0.82–2.00 V</text>
  <text class="small" x="1270" y="370">relative to sensor GND</text>
  <text class="tiny" x="1260" y="415">exact part, tolerances, current,</text>
  <text class="tiny" x="1260" y="438">output drive and fault behavior TBD</text>
  <circle class="terminal" cx="1220" cy="230" r="7"/>
  <circle class="terminal" cx="1220" cy="610" r="7"/>
  <circle class="terminal" cx="1220" cy="790" r="7"/>
  <text class="net-label" x="1240" y="238">VCC</text>
  <text class="net-label" x="1240" y="618">OUT</text>
  <text class="ground-label" x="1240" y="798">GND</text>

  <rect class="protection-zone" x="1270" y="565" width="205" height="84" rx="9"/>
  <text class="small" x="1300" y="596">Hall element and</text>
  <text class="small" x="1286" y="623">output stage (internal)</text>
  <path class="wire" d="M1220 610 H1270"/>
  <path class="wire" d="M1220 230 H1490 V300"/>
  <path class="component" d="M1460 300 H1518 M1460 320 H1518"/>
  <path class="wire" d="M1490 320 H1505 V775 H1220 V790"/>
  <text class="tiny" x="1372" y="296">C_LOCAL</text>
  <text class="tiny" x="1280" y="474">Sensor-end bypass per exact data sheet</text>

  <!-- Signal conductor and connector -->
  <path class="wire" d="M1220 610 H1055"/>
  <rect class="connector" x="1025" y="590" width="30" height="40" rx="4"/>
  <path class="wire" d="M1025 610 H955"/>
  <circle class="junction" cx="955" cy="610" r="7"/>
  <text class="small" x="905" y="565">Molex F3</text>
  <text class="tiny" x="905" y="585">AcHdl Sig</text>
  <text class="net-label" x="1068" y="593">THROTTLE_SIGNAL</text>

  <!-- Connector-side transient protection allocation -->
  <path class="wire" d="M955 610 V645"/>
  <rect class="protection-zone" x="880" y="645" width="150" height="72" rx="10"/>
  <path class="wire" d="M955 717 V740"/>
  <path class="component" d="M923 740 H987 M933 752 H977 M943 764 H967"/>
  <text class="small" x="913" y="674">D_ESD</text>
  <text class="tiny" x="894" y="699">transient path: TBD</text>
  <text class="tiny" x="665" y="724">PROTECTION_RETURN: TBD</text>
  <text class="tiny" x="665" y="744">separate from quiet ADC return</text>

  <!-- Series resistor and signal ADC -->
  <path class="wire" d="M955 610 H745"/>
  <path class="component" d="M745 610 l-12 -13 l-19 26 l-19 -26 l-19 26 l-19 -26 l-19 26 l-12 -13"/>
  <path class="wire" d="M626 610 H545"/>
  <circle class="junction" cx="545" cy="610" r="7"/>
  <text class="label" x="768" y="569">R_SIG</text>
  <text class="small" x="758" y="591">0.982 kΩ measured</text>

  <path class="wire" d="M545 610 H315"/>
  <rect class="adc-zone" x="70" y="574" width="245" height="72" rx="10"/>
  <text class="label" x="93" y="601">ADC_SIGNAL · ADC2_IN2</text>
  <text class="tiny" x="132" y="628">Pad 91 · 0.8244 V measured</text>
  <text class="net-label" x="392" y="595">ADC_SIGNAL</text>

  <!-- ADC-side open-path bias -->
  <path class="wire" d="M545 610 V630"/>
  <path class="component" d="M545 630 l-13 12 l26 17 l-26 17 l26 17 l-26 17 l13 12"/>
  <path class="wire" d="M545 722 V790"/>
  <text class="label" x="563" y="660">R_OPEN</text>
  <text class="small" x="572" y="684">47.0 kΩ</text>
  <text class="tiny" x="565" y="707">upstream-open bias</text>

  <!-- Signal filter -->
  <circle class="junction" cx="400" cy="610" r="6"/>
  <path class="wire" d="M400 610 V680"/>
  <path class="component" d="M368 680 H432 M368 700 H432"/>
  <path class="wire" d="M400 700 V790"/>
  <text class="label" x="330" y="727">C_SIG</text>
  <text class="small" x="328" y="751">100 nF</text>

  <!-- Low-leakage ADC clamp allocation -->
  <path class="wire" d="M545 610 V570"/>
  <rect class="protection-zone" x="480" y="500" width="130" height="70" rx="10"/>
  <text class="small" x="511" y="528">D_ADC</text>
  <text class="tiny" x="492" y="553">high / low clamp</text>
  <path class="wire" d="M545 500 V480 H470"/>
  <rect class="protection-zone" x="290" y="470" width="180" height="76" rx="10"/>
  <text class="tiny" x="315" y="498">qualified clamp-current</text>
  <text class="tiny" x="322" y="519">sink(s) / rails: TBD</text>

  <!-- Dedicated sensor return -->
  <rect class="connector" x="1025" y="770" width="30" height="40" rx="4"/>
  <path class="wire" d="M1055 790 H1220"/>
  <path class="wire" d="M80 790 H1025"/>
  <circle class="junction" cx="400" cy="790" r="6"/>
  <circle class="junction" cx="545" cy="790" r="6"/>
  <text class="small" x="918" y="838">Molex F4</text>
  <text class="tiny" x="915" y="858">AcHdl Gnd</text>
  <text class="ground-label" x="1080" y="772">THROTTLE_GND</text>

  <path class="component" d="M80 790 V815 M48 815 H112 M58 827 H102 M68 839 H92"/>
  <text class="ground-label" x="125" y="828">QUIET ANALOG_GND / STAR RETURN</text>

  <!-- Footer -->
  <rect class="protection-zone" x="55" y="900" width="55" height="28" rx="5"/>
  <text class="small" x="125" y="920">Unresolved protection/current-limit allocation</text>
  <rect class="adc-zone" x="525" y="900" width="55" height="28" rx="5"/>
  <text class="small" x="595" y="920">ADC measurement boundary</text>
  <text class="note" x="925" y="920">Connector part, protection sinks and part ratings remain TBD</text>
  <text class="note" x="925" y="947">Do not derive 3V3_THROTTLE from an undocumented SoM rail</text>
</svg>
