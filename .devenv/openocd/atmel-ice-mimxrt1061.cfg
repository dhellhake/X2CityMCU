# Atmel-ICE is used only as the CMSIS-DAP/SWD transport here. The stock
# OpenOCD installation has no i.MX RT FlexSPI flash bank driver; QSPI writes
# are performed separately by .devenv/program-qspi.ps1 using NXP's FLM.

source [find interface/cmsis-dap.cfg]

# Atmel-ICE CMSIS-DAP v1 (USB HID). Restrict discovery to the probe's VID/PID;
# callers may pre-set X2_PROBE_SERIAL to select one probe deterministically.
cmsis-dap vid_pid 0x03eb 0x2141
cmsis-dap backend hid

if {[info exists X2_PROBE_SERIAL] && ($X2_PROBE_SERIAL ne "")} {
    adapter serial $X2_PROBE_SERIAL
}

transport select swd
if {![info exists X2_ADAPTER_SPEED_KHZ]} {
    set X2_ADAPTER_SPEED_KHZ 100
}
adapter speed $X2_ADAPTER_SPEED_KHZ

set CHIPNAME mimxrt1061
set TARGETNAME $CHIPNAME.cpu

source [find target/swj-dp.tcl]

# DPIDR observed on the MIMXRT1061 Cortex-M7 r1p1 over the connected Atmel-ICE.
swj_newdap $CHIPNAME cpu -irlen 4 -expected-id 0x0bd11477
dap create $CHIPNAME.dap -chain-position $CHIPNAME.cpu
target create $TARGETNAME cortex_m -endian little -dap $CHIPNAME.dap

# This configuration deliberately declares no flash bank and performs no
# reset/init command. It is safe for attach to an application booted from QSPI.
# POR_B is wired to the Atmel-ICE reset output; a requested reset therefore
# performs the power-on reset needed to re-latch BOOT_MODE and run Boot ROM.
cortex_m reset_config sysresetreq
reset_config srst_only srst_gates_jtag
