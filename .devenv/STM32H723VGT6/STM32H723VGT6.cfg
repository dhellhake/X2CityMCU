# WeAct Studio STM32H723VGT6, Atmel-ICE CMSIS-DAP over SWD.
# Target reference: 3V3; SWDIO: PA13; SWCLK: PA14; common GND.
# NRST is available on the edge header if the probe reset wire is connected.
adapter driver cmsis-dap
cmsis-dap backend hid
cmsis-dap vid_pid 0x03eb 0x2141
transport select swd

set CHIPNAME stm32h723vgt6
source [find target/stm32h7x.cfg]
# The upstream work area overlaps the relocated DTCM vectors and task state.
# Preserve it around flash/CRC algorithms so live image verification can resume.
stm32h723vgt6.cpu0 configure -work-area-backup 1
adapter speed 1000

# The board's four-pin SWD header does not include NRST. Core reset works
# with that header; connect NRST separately for recovery under reset.
reset_config none
cortex_m reset_config sysresetreq
