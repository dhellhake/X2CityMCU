# Atmel-ICE attached to the STM32H743IIT6 SWD pins through its CMSIS-DAP
# interface. Pin 1 -> VTref, pin 2 -> SWDIO, pin 4 -> SWCLK,
# pin 5 -> GND, and pin 10 -> NRST.
adapter driver cmsis-dap
cmsis-dap backend hid
cmsis-dap vid_pid 0x03eb 0x2141
transport select swd

set CHIPNAME stm32h743iit6
source [find target/stm32h7x_dual_bank.cfg]

reset_config srst_only srst_nogate
